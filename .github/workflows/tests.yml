# Runs the fast test suite on every push and pull request. The optional
# `detectors` extra (torch, model downloads) is not installed here, so the
# model-backed tests skip themselves; the API, billing, features and
# rule-based engine tests run in full.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[api,dev]"
      - run: python -m pytest -q -p no:cacheprovider
        env:
          HF_HUB_OFFLINE: "1"
          LONGHAND_PAYWALL: "0"
