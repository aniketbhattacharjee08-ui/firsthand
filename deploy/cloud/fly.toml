# Vervly API on Fly.io: one small CPU machine with a volume for SQLite
# and the surrogate weights. Deploy from the repo root:
#   fly launch --no-deploy --copy-config --config deploy/cloud/fly.toml   (first time, creates the app)
#   fly volumes create vervly_data --size 5 --region sjc --config deploy/cloud/fly.toml
#   fly secrets set --config deploy/cloud/fly.toml $(grep -v '^#' deploy/.env | grep -v '^$' | xargs)
#   fly deploy --config deploy/cloud/fly.toml
app = "vervly-api"
primary_region = "sjc"

# The Dockerfile is passed on the command line (deploy/cloud/go.sh), because
# a path here resolves relative to this file, not to the build context.

[env]
  PORT = "8000"

[[mounts]]
  source = "vervly_data"
  destination = "/data"
  initial_size = "5gb"

[http_service]
  internal_port = 8000
  force_https = true
  # Rewrites run for minutes over SSE; never stop the machine under them.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "180s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
