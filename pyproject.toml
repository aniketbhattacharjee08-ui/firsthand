[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "humanizer"
version = "0.1.0"
description = "Feature extraction, reference distributions, and detector bench for AI-text humanization research"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.31",
]

[project.optional-dependencies]
# Clause-level syntax. Closes the parser gap flagged in research/10.
syntax = ["spacy>=3.7"]
# Local detector bench: `humanizer.detectors.local`. Only needed for Stage 3+.
# ~1.4GB of wheels, plus model weights fetched from the Hugging Face hub on
# first score(): gpt2 525MB, openai-community/roberta-base-openai-detector
# 480MB, distilgpt2 339MB if used. CPU-only; no CUDA build is required.
# Everything degrades to available:false without this extra.
detectors = ["torch>=2.0", "transformers>=4.40"]
# Grammar/mechanics gating.
quality = ["language-tool-python>=2.7"]
# HTTP API and static frontend host. httpx is needed by fastapi's TestClient.
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "python-multipart>=0.0.9"]
# Sign in with Apple needs an ES256-signed client secret; Google does not.
oauth = ["cryptography>=42"]
dev = ["pytest>=7.4"]

[project.scripts]
humanizer = "humanizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
